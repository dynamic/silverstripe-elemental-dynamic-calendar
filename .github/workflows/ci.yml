name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: silverstripe/gha-ci/.github/workflows/ci.yml@v1
    with:
      phpcoverage: false
      js: false
      # TEMPORARY - remove when dynamic/silverstripe-calendar 2.2.0 is tagged
      # and this module's constraint moves to ^2.2. The test suite needs the
      # stage-safe parent validation fix that is not in any 2.x tag yet.
      composer_require_extra: "dynamic/silverstripe-calendar:dev-perf/feed-optimisation as 2.99.0"
